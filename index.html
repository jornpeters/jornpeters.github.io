<script>
(() => {
'use strict';

/* ============================================================
   JORN PETERS — fig. 1, a machine that learns.
   A hidden-line drawing in three dimensions: solids are filled
   with the paper colour, then their edges are inked on top.
   Flow runs along +x, y is up. No dependencies.
   ============================================================ */

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const smooth = (t) => t * t * (3 - 2 * t);
const PI = Math.PI, TAU = PI * 2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
const rgb = (h) => [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255];

const BG = rgb(0x0b0814), INK = rgb(0xe9e4f7), ACCENT = rgb(0xffb45e);

const canvas = $('#gl');
if (COARSE) $('#hint').textContent = 'Tap to feed · drag to turn';
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
if (!gl) { document.body.classList.add('nogl', 'ready'); return; }
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); document.body.classList.add('nogl'); });

/* ============================================================
   matrices — column-major
   ============================================================ */
const m4 = {
  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  identity(o) { o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  copy(o, a) { o.set(a); return o; },
  mul(o, a, b) {
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3], a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7],
          a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11], a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    for (let i = 0; i < 16; i += 4) {
      const b0 = b[i], b1 = b[i + 1], b2 = b[i + 2], b3 = b[i + 3];
      o[i]     = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
      o[i + 1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
      o[i + 2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
      o[i + 3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
    }
    return o;
  },
  translate(o, x, y, z) {
    o[12] += o[0] * x + o[4] * y + o[8] * z;
    o[13] += o[1] * x + o[5] * y + o[9] * z;
    o[14] += o[2] * x + o[6] * y + o[10] * z;
    o[15] += o[3] * x + o[7] * y + o[11] * z;
    return o;
  },
  scale(o, x, y, z) {
    for (let i = 0; i < 4; i++) { o[i] *= x; o[4 + i] *= y; o[8 + i] *= z; }
    return o;
  },
  rotX(o, a) {
    const c = Math.cos(a), s = Math.sin(a);
    for (let i = 0; i < 4; i++) { const y = o[4 + i], z = o[8 + i]; o[4 + i] = y * c + z * s; o[8 + i] = z * c - y * s; }
    return o;
  },
  rotY(o, a) {
    const c = Math.cos(a), s = Math.sin(a);
    for (let i = 0; i < 4; i++) { const x = o[i], z = o[8 + i]; o[i] = x * c - z * s; o[8 + i] = x * s + z * c; }
    return o;
  },
  rotZ(o, a) {
    const c = Math.cos(a), s = Math.sin(a);
    for (let i = 0; i < 4; i++) { const x = o[i], y = o[4 + i]; o[i] = x * c + y * s; o[4 + i] = y * c - x * s; }
    return o;
  },
  ortho(o, l, r, b, t, n, f) {
    o.fill(0);
    o[0] = 2 / (r - l); o[5] = 2 / (t - b); o[10] = -2 / (f - n);
    o[12] = -(r + l) / (r - l); o[13] = -(t + b) / (t - b); o[14] = -(f + n) / (f - n); o[15] = 1;
    return o;
  },
  lookAt(o, e, t, up) {
    let zx = e[0] - t[0], zy = e[1] - t[1], zz = e[2] - t[2];
    let l = 1 / Math.hypot(zx, zy, zz); zx *= l; zy *= l; zz *= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = 1 / Math.hypot(xx, xy, xz); xx *= l; xy *= l; xz *= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0;
    o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0;
    o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * e[0] + xy * e[1] + xz * e[2]);
    o[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);
    o[14] = -(zx * e[0] + zy * e[1] + zz * e[2]);
    o[15] = 1;
    return o;
  },
  point(m, p) {
    return [
      m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12],
      m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13],
      m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14],
    ];
  },
};
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

/* ============================================================
   solids — a bag of flat polygons plus loose lines.
   build() turns it into filled triangles and an edge list;
   an edge remembers the two faces it joins, so the shader can
   tell a crease from a smooth seam from an outline.
   ============================================================ */
const SMOOTH = 0, CREASE = 1, LINE = 2, DASH = 3;        // edge kinds
const T_INK = 0, T_DIM = 1, T_ACC = 2;                   // tones

class Solid {
  constructor() { this.polys = []; this.lines = []; this.m = m4.create(); this.st = []; this.tone = T_INK; }
  push() { this.st.push(this.m.slice()); return this; }
  pop() { this.m = this.st.pop(); return this; }
  move(x, y, z) { m4.translate(this.m, x, y, z); return this; }
  rx(a) { m4.rotX(this.m, a); return this; }
  ry(a) { m4.rotY(this.m, a); return this; }
  rz(a) { m4.rotZ(this.m, a); return this; }
  ink(t) { this.tone = t; return this; }

  poly(pts) {
    const P = pts.map(p => m4.point(this.m, p));
    let nx = 0, ny = 0, nz = 0;                           // newell
    for (let i = 0; i < P.length; i++) {
      const a = P[i], b = P[(i + 1) % P.length];
      nx += (a[1] - b[1]) * (a[2] + b[2]); ny += (a[2] - b[2]) * (a[0] + b[0]); nz += (a[0] - b[0]) * (a[1] + b[1]);
    }
    const l = Math.hypot(nx, ny, nz) || 1;
    this.polys.push({ pts: P, n: [nx / l, ny / l, nz / l], tone: this.tone });
    return this;
  }
  line(a, b, kind = LINE, tone = this.tone) {
    this.lines.push({ a: m4.point(this.m, a), b: m4.point(this.m, b), kind, tone });
    return this;
  }
  box(w, h, d, x, y, z) {
    const x0 = x - w / 2, x1 = x + w / 2, y0 = y - h / 2, y1 = y + h / 2, z0 = z - d / 2, z1 = z + d / 2;
    const P = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
    for (const f of [[4, 5, 6, 7], [1, 0, 3, 2], [5, 1, 2, 6], [0, 4, 7, 3], [7, 6, 2, 3], [0, 1, 5, 4]]) this.poly(f.map(i => P[i]));
    return this;
  }
  // n-sided prism or frustum standing on y; caps: 1 top, 2 bottom
  prism(rt, rb, h, n, x, y, z, phase = 0, caps = 3) {
    const y0 = y - h / 2, y1 = y + h / 2, top = [], bot = [];
    for (let i = 0; i < n; i++) {
      const a = phase + i / n * TAU;
      top.push([x + rt * Math.cos(a), y1, z + rt * Math.sin(a)]);
      bot.push([x + rb * Math.cos(a), y0, z + rb * Math.sin(a)]);
    }
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; this.poly([bot[j], bot[i], top[i], top[j]]); }
    if (caps & 1) this.poly(top.slice().reverse());
    if (caps & 2) this.poly(bot);
    return this;
  }
  // flat washer standing on y
  ring(ro, ri, h, n, x, y, z) {
    const y0 = y - h / 2, y1 = y + h / 2;
    const at = (r, a, yy) => [x + r * Math.cos(a), yy, z + r * Math.sin(a)];
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU, b = (i + 1) / n * TAU;
      this.poly([at(ro, b, y0), at(ro, a, y0), at(ro, a, y1), at(ro, b, y1)]);
      this.poly([at(ri, a, y0), at(ri, b, y0), at(ri, b, y1), at(ri, a, y1)]);
      this.poly([at(ro, a, y1), at(ri, a, y1), at(ri, b, y1), at(ro, b, y1)]);
      this.poly([at(ro, b, y0), at(ri, b, y0), at(ri, a, y0), at(ro, a, y0)]);
    }
    return this;
  }
  // a drawn circle lying flat on y
  circle(r, n, x, y, z, kind = LINE, tone = this.tone) {
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU, b = (i + 1) / n * TAU;
      this.line([x + r * Math.cos(a), y, z + r * Math.sin(a)], [x + r * Math.cos(b), y, z + r * Math.sin(b)], kind, tone);
    }
    return this;
  }

  build() {
    const f = [], e = [];
    for (const p of this.polys)
      for (let i = 1; i < p.pts.length - 1; i++)
        for (const v of [p.pts[0], p.pts[i], p.pts[i + 1]]) f.push(v[0], v[1], v[2], p.n[0], p.n[1], p.n[2]);

    const q = (v) => Math.round(v[0] * 2000) + ',' + Math.round(v[1] * 2000) + ',' + Math.round(v[2] * 2000);
    const map = new Map();
    for (const p of this.polys) {
      for (let i = 0; i < p.pts.length; i++) {
        const a = p.pts[i], b = p.pts[(i + 1) % p.pts.length], ka = q(a), kb = q(b);
        if (ka === kb) continue;
        const k = ka < kb ? ka + '|' + kb : kb + '|' + ka;
        let s = map.get(k);
        if (!s) map.set(k, s = { a, b, n: [], tone: p.tone });
        s.n.push(p.n);
      }
    }
    const put = (a, b, n1, n2, kind, tone) => {
      for (const [t, s] of [[0, -1], [1, -1], [1, 1], [0, -1], [1, 1], [0, 1]])
        e.push(a[0], a[1], a[2], b[0], b[1], b[2], n1[0], n1[1], n1[2], n2[0], n2[1], n2[2], t, s, kind, tone);
    };
    for (const s of map.values()) {
      const n1 = s.n[0];
      if (s.n.length === 1) { put(s.a, s.b, n1, [-n1[0], -n1[1], -n1[2]], CREASE, s.tone); continue; }
      const n2 = s.n[1], d = dot(n1, n2);
      if (d > .9995) continue;                            // same plane: not an edge at all
      put(s.a, s.b, n1, n2, d > .74 ? SMOOTH : CREASE, s.tone);
    }
    for (const l of this.lines) put(l.a, l.b, [0, 1, 0], [0, -1, 0], l.kind, l.tone);
    return { f: new Float32Array(f), e: new Float32Array(e) };
  }
}

/* ============================================================
   programs
   ============================================================ */
function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, '#version 300 es\nprecision highp float;\n' + src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader failed');
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || 'link failed');
  const u = {};
  for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

// the body of every solid: paper colour, barely lit, so lines behind it disappear
const VS_FACE = `
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNor;
uniform mat4 uVP, uModel;
out vec3 vN; out float vX;
void main(){
  vec4 w = uModel * vec4(aPos, 1.);
  vN = mat3(uModel) * aNor; vX = w.x;
  gl_Position = uVP * w;
}`;
const FS_FACE = `
in vec3 vN; in float vX;
uniform vec3 uBg, uAccent, uLight;
uniform float uFill, uReveal;
out vec4 o;
void main(){
  if (vX > uReveal) discard;
  vec3 n = normalize(vN);
  if (!gl_FrontFacing) n = -n;
  float l = max(dot(n, uLight), 0.);
  vec3 c = uBg + vec3(.60, .52, .95) * (.012 + .05 * l);
  c = mix(c, uAccent * (.5 + .5 * l), uFill);
  o = vec4(c, 1.);
}`;
// every edge is a ribbon of constant width on screen
const VS_EDGE = `
layout(location=0) in vec3 aA;
layout(location=1) in vec3 aB;
layout(location=2) in vec3 aN1;
layout(location=3) in vec3 aN2;
layout(location=4) in vec4 aP;          // along, side, kind, tone
uniform mat4 uVP, uModel;
uniform vec2 uView;
uniform vec3 uFwd;
uniform float uPx, uBias;
uniform vec2 uDepth;
out float vD, vKind, vTone, vX, vW, vFar;
void main(){
  vec4 wa = uModel * vec4(aA, 1.), wb = uModel * vec4(aB, 1.);
  vec4 ca = uVP * wa, cb = uVP * wb;
  vec2 h = uView * .5;
  vec2 d = (cb.xy - ca.xy) * h;
  float len = length(d);
  d = len > 1e-4 ? d / len : vec2(1., 0.);
  float w = .9, weight = .62;
  bool show = true;
  if (aP.z < 1.5) {
    mat3 R = mat3(uModel);
    bool outline = dot(R * aN1, uFwd) * dot(R * aN2, uFwd) <= 0.;
    if (aP.z < .5 && !outline) show = false;
    w = outline ? 1.75 : 1.05;
    weight = outline ? 1. : .66;
  }
  w *= uPx;
  vec4 p = mix(ca, cb, aP.x);
  p.xy += (vec2(-d.y, d.x) * aP.y + d * (aP.x * 2. - 1.)) * w * .5 / h;
  p.z -= uBias;
  vD = aP.x * len; vKind = aP.z; vTone = aP.w; vW = weight;
  vX = mix(wa.x, wb.x, aP.x);
  vFar = smoothstep(uDepth.x, uDepth.y, dot(mix(wa.xyz, wb.xyz, aP.x), uFwd));
  gl_Position = show ? p : vec4(2., 2., 2., 1.);
}`;
const FS_EDGE = `
in float vD, vKind, vTone, vX, vW, vFar;
uniform vec3 uBg, uInk, uAccent;
uniform float uPx, uReveal, uEmph, uHot;
out vec4 o;
void main(){
  if (vX > uReveal) discard;
  if (vKind > 2.5 && mod(vD, 11. * uPx) > 6. * uPx) discard;
  float a = vW * uEmph * mix(1., .68, vFar);      // what is further away is drawn fainter
  if (vTone > .5 && vTone < 1.5) a *= .5;
  vec3 c = vTone > 1.5 ? uAccent : mix(uInk, uAccent, uHot);
  // the ink runs bright just behind the pen as the figure is drawn
  a *= 1. + .9 * smoothstep(1.6, 0., uReveal - vX);
  o = vec4(mix(uBg, c, clamp(a, 0., 1.)), 1.);
}`;

let FACE, EDGE;
try { FACE = program(VS_FACE, FS_FACE); EDGE = program(VS_EDGE, FS_EDGE); }
catch (err) { console.error(err); document.body.classList.add('nogl', 'ready'); return; }

/* ---------- parts: a solid on the gpu, with a place in the world ---------- */
const parts = [];
function upload(data, stride, layout, usage = gl.STATIC_DRAW) {
  const vao = gl.createVertexArray(), buf = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, usage);
  let off = 0;
  layout.forEach((n, i) => {
    gl.enableVertexAttribArray(i);
    gl.vertexAttribPointer(i, n, gl.FLOAT, false, stride * 4, off * 4);
    off += n;
  });
  gl.bindVertexArray(null);
  return { vao, buf };
}
function part(solid, group = -1, listed = true) {
  const { f, e } = solid.build();
  const p = {
    fv: upload(f, 6, [3, 3]), fn: f.length / 6,
    ev: upload(e, 16, [3, 3, 3, 3, 4]), en: e.length / 16,
    M: m4.create(), group,
  };
  if (listed) parts.push(p);
  return p;
}

/* ============================================================
   the machine
   ============================================================ */
const H = 2.9;                       // height of the line the samples travel along
const CUBE = .56;
const RAIL = H - CUBE / 2;           // top of the rails
const XH = -8.8, XD = -5, XK = -2.9, XR = [-1, 1, 3], XG = 5.6, XP = 8.7;   // where things stand along the bed
const RING = 1.8, PEGS = 8;
const GAUGE = [XG, 5.35, 0];
const SLOT = (i) => XP + .72 - i * .66;
const GROUPS = [
  { name: 'Data',   at: [XH, 5.4, -1.5],  box: [XH - 1.2, XH + 1.2, 5.4] },
  { name: 'Filter', at: [XD, 4.34, 0],    box: [XD - 1.5, XK + .4, 4.4] },
  { name: 'Train',  at: [XR[1], 4.76, 0], box: [XR[0] - .4, XR[2] + .4, 4.8] },
  { name: 'Eval',   at: [XG, 6.5, 0],     box: [XG - .8, XG + .8, 6.5] },
  { name: 'Model',  at: [XP, 3.3, 0],     box: [XP - 1.2, XP + 1.3, 3.4] },
];
const LABEL_Y = 7.7;
const BOUNDS = { min: [-10.8, -.2, -2.5], max: [10.8, LABEL_Y + .35, 2.5] };

let drum, kicker, needle, cube, strings;
const rings = [];

function buildMachine() {
  /* --- bed, rails and everything that belongs to no stage --- */
  let s = new Solid();
  s.box(21.2, .35, 4.6, 0, .175, 0);
  for (const x of [-9.8, 9.8]) for (const z of [-1.7, 1.7]) s.prism(.42, .42, .2, 28, x, -.1, z);
  s.ink(T_DIM);
  for (const x of [-10.2, 10.2]) for (const z of [-1.95, 1.95]) s.prism(.13, .13, .08, 6, x, .39, z);
  s.ink(T_INK);
  for (const [x0, x1] of [[XH + 1.1, XD - 1.3], [XD + 1.3, XP - 1.15]])
    for (const z of [-.2, .2]) s.box(x1 - x0, .1, .1, (x0 + x1) / 2, RAIL - .05, z);
  for (const x of [-7, -2.2, 4.4, 6.9]) {
    s.box(.12, RAIL - .55, .12, x, .35 + (RAIL - .55) / 2, 0);
    s.box(.12, .1, .62, x, RAIL - .15, 0);
  }
  // the axis of the machine, as a draughtsman would mark it
  s.line([-11.2, H, 0], [11.2, H, 0], DASH, T_DIM);
  part(s);

  /* --- 1 · data: a hopper --- */
  s = new Solid();
  s.box(2.2, 3.4, 2.2, XH, 2.05, 0);
  s.prism(1.5 * Math.SQRT2, .7 * Math.SQRT2, 1.6, 4, XH, 4.55, 0, PI / 4, 0);
  const ox = XH + 1.103;
  s.line([ox, 2.52, -.42], [ox, 3.3, -.42]).line([ox, 3.3, -.42], [ox, 3.3, .42])
   .line([ox, 3.3, .42], [ox, 2.52, .42]).line([ox, 2.52, .42], [ox, 2.52, -.42]);
  s.ink(T_DIM);
  for (let i = 0; i < 4; i++) s.line([XH - .65, .95 + i * .22, 1.103], [XH + .65, .95 + i * .22, 1.103]);
  part(s, 0);

  /* --- 2 · filter: a drum on rollers, and a kicker for what fails --- */
  s = new Solid();
  for (const x of [XD - 1.15, XD + 1.15]) for (const z of [-.95, .95]) {
    s.box(.5, .86, .5, x, .78, z);
    s.push().move(x, 1.514, z).rz(-PI / 2).prism(.3, .3, .34, 24, 0, 0, 0).pop();
  }
  s.box(.14, 2.35, .14, XK, 1.525, -1.0);
  s.box(.5, .42, .5, XK, H, -1.0);
  part(s, 1);

  s = new Solid();
  s.push().rz(-PI / 2);
  s.prism(1.25, 1.25, 2.6, 56, 0, 0, 0);
  for (const y of [-1.15, 1.15]) s.prism(1.38, 1.38, .3, 56, 0, y, 0);
  for (const y of [-1.302, 1.302]) s.circle(.46, 32, 0, y, 0);
  for (let i = 0; i < 6; i++) s.push().ry(i / 6 * TAU).box(.08, 1.9, .16, 1.27, 0, 0).pop();
  s.pop();
  drum = part(s, 1);

  s = new Solid();
  s.box(.16, .16, .5, 0, 0, 0);
  kicker = part(s, 1);

  /* --- 3 · train: three rings strung together; training turns them --- */
  s = new Solid();
  const rod = .13, rz = .95, ry = H - Math.sqrt((RING + rod) ** 2 - rz * rz);
  const r0 = XR[0] - .6, r1 = XR[2] + .6;
  for (const z of [-rz, rz]) {
    s.push().move((r0 + r1) / 2, ry, z).rz(-PI / 2).prism(rod, rod, r1 - r0, 20, 0, 0, 0).pop();
    for (const x of [r0 + .25, r1 - .25]) s.box(.4, ry - rod - .35, .4, x, .35 + (ry - rod - .35) / 2, z);
  }
  part(s, 2);

  rings.length = 0;
  for (const x of XR) {
    s = new Solid();
    s.push().rz(-PI / 2);
    s.ring(RING, RING - .36, .12, 72, 0, 0, 0);
    const pegs = [];
    for (let i = 0; i < PEGS; i++) {
      const a = i / PEGS * TAU, px = (RING - .18) * Math.cos(a), pz = (RING - .18) * Math.sin(a);
      s.prism(.1, .1, .36, 16, px, 0, pz);
      pegs.push([m4.point(s.m, [px, -.18, pz]), m4.point(s.m, [px, .18, pz])]);
    }
    s.pop();
    const p = part(s, 2);
    p.pegs = pegs; p.x = x; p.a = 0; p.goal = 0; p.vel = 0; p.drift = 0;
    rings.push(p);
  }

  /* --- 4 · eval: a gate with a dial on it --- */
  s = new Solid();
  for (const z of [-.8, .8]) s.box(.2, 3.7, .2, XG, 2.2, z);
  s.box(.2, .2, 1.8, XG, 4.15, 0);
  s.push().move(...GAUGE).rx(PI / 2);
  s.prism(1, 1, .4, 64, 0, 0, 0);
  for (const y of [-.17, .17]) s.ring(1.08, .95, .1, 64, 0, y, 0);
  s.prism(.09, .09, .5, 16, 0, 0, 0);
  for (const y of [-.203, .203]) {
    for (let i = 0; i <= 12; i++) {
      const b = (225 - i * 22.5) / 180 * PI, t0 = i % 3 ? .8 : .72;
      s.line([t0 * Math.cos(b), y, -t0 * Math.sin(b)], [.9 * Math.cos(b), y, -.9 * Math.sin(b)], LINE, i % 3 ? T_DIM : T_INK);
    }
  }
  s.pop();
  part(s, 3);

  s = new Solid();
  for (const z of [-.206, .206]) s.line([-.14, 0, z], [.7, 0, z], LINE, T_ACC);
  needle = part(s, 3);

  /* --- 5 · model: where the finished thing is set down --- */
  s = new Solid();
  s.prism(.5, .5, .1, 32, XP, .4, 0);
  s.prism(.28, .28, RAIL - .55, 32, XP, .45 + (RAIL - .55) / 2, 0);
  s.box(2.3, .1, 1.3, XP, RAIL - .05, 0);
  s.box(.1, .34, 1.3, XP + 1.1, RAIL + .17, 0);
  part(s, 4);

  /* --- leader lines up to the callouts --- */
  GROUPS.forEach((g, i) => {
    s = new Solid();
    const [x, y, z] = g.at;
    s.line([x, y + .22, z], [x, LABEL_Y, z], LINE, T_DIM);
    s.line([x - .09, y + .22, z], [x + .09, y + .22, z], LINE, T_DIM);
    s.line([x, y + .22, z - .09], [x, y + .22, z + .09], LINE, T_DIM);
    part(s, i);
  });

  cube = part(new Solid().box(1, 1, 1, 0, 0, 0), -1, false);

  // the strings are re-strung every frame
  const n = (XR.length - 1) * PEGS * 3;
  strings = { n: n * 6, data: new Float32Array(n * 6 * 16) };
  Object.assign(strings, upload(strings.data, 16, [3, 3, 3, 3, 4], gl.DYNAMIC_DRAW));
}

const QUAD = [[0, -1], [1, -1], [1, 1], [0, -1], [1, 1], [0, 1]];
function restring() {
  const d = strings.data;
  let o = 0;
  for (let k = 0; k < rings.length - 1; k++) {
    const r0 = rings[k], r1 = rings[k + 1];
    for (let i = 0; i < PEGS; i++) {
      const a = m4.point(r0.M, r0.pegs[i][1]);
      for (let j = -1; j <= 1; j++) {
        const b = m4.point(r1.M, r1.pegs[(i + j + PEGS) % PEGS][0]);
        for (const [t, s] of QUAD) {
          d[o] = a[0]; d[o + 1] = a[1]; d[o + 2] = a[2]; d[o + 3] = b[0]; d[o + 4] = b[1]; d[o + 5] = b[2];
          d[o + 7] = 1; d[o + 10] = -1; d[o + 12] = t; d[o + 13] = s; d[o + 14] = LINE; d[o + 15] = T_INK;
          o += 16;
        }
      }
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, strings.buf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, d);
}

/* ============================================================
   the run — hollow samples go in, solid ones come out
   ============================================================ */
const SPEED = 1.7, EVERY = 4.4, MIN_GAP = 1.7, G = 14;
const STOPS = [{ x: XK, hold: 0 }, { x: XR[1], hold: 1.5 }, { x: XG, hold: .7 }];
const samples = Array.from({ length: 16 }, () => ({ on: false }));
const plate = [];
let queue = 0, since = EVERY - .4;
let trainPulse = 0, kick = 0, drumSpin = 0, gaugeV = .18, gaugeVel = 0, acc = .52;

function feed() { queue = Math.min(queue + 1, 5); }
function drop() {
  const c = samples.find(q => !q.on);
  if (!c) return;
  Object.assign(c, {
    on: true, mode: 'fall', t: 0, x: XH, y: 9, z: 0, s: 0, ry: 0, rx: 0, rz: 0,
    fill: 0, next: 0, hold: 0, done: false, bad: Math.random() < .2, vy: 0, vz: 0, spin: 0,
  });
  since = 0;
}
function step(dt) {
  since += dt;
  if (since >= (queue ? MIN_GAP : EVERY)) { if (queue) queue--; drop(); }

  let training = 0, inDrum = 0;
  for (const c of samples) {
    if (!c.on) continue;
    if (c.mode === 'fall') {
      c.t += dt;
      const k = clamp(c.t / 1.0, 0, 1);
      c.y = lerp(8.4, H, k * k); c.s = smooth(clamp(c.t / .3, 0, 1));
      c.ry = (1 - k) * 1.2;
      if (k >= 1) { c.mode = 'run'; c.ry = 0; }
    } else if (c.mode === 'run') {
      c.x += SPEED * dt;
      if (Math.abs(c.x - XD) < 1.4) inDrum = 1;
      const stop = STOPS[c.next];
      if (stop && c.x >= stop.x) {
        c.x = stop.x; c.next++;
        if (c.next === 1) {
          if (c.bad) { c.mode = 'out'; c.t = 0; c.vz = 2.1; c.vy = 1.6; c.spin = 3 + Math.random() * 3; kick = 1; }
        } else { c.mode = 'hold'; c.hold = stop.hold; c.t = 0; c.done = false; }
      } else if (!stop) {
        if (!plate.includes(c)) plate.push(c);
        c.x = Math.min(c.x, SLOT(plate.indexOf(c)));
      }
    } else if (c.mode === 'hold') {
      c.t += dt;
      const k = clamp(c.t / c.hold, 0, 1), w = Math.sin(k * PI);
      if (c.next === 2) {                                  // training
        training = Math.max(training, w);
        c.fill = smooth(k); c.ry += dt * w * 5; c.y = H + w * .35;
        if (!c.done && k > .15) { c.done = true; for (const r of rings) r.goal += (Math.random() - .5) * 1.5; }
      } else if (!c.done && k > .3) {                      // evaluation
        c.done = true;
        acc = acc > .93 ? .55 + Math.random() * .1 : acc + (.97 - acc) * (.2 + Math.random() * .2);
      }
      if (k >= 1) { c.mode = 'run'; c.y = H; c.ry = 0; }
    } else if (c.mode === 'out') {                         // kicked off the line
      c.t += dt; c.vy -= G * dt;
      c.y += c.vy * dt; c.z += c.vz * dt;
      c.rx += dt * c.spin; c.rz += dt * c.spin * .6;
      if (c.y < .35 + CUBE / 2) { c.y = .35 + CUBE / 2; c.vy *= -.3; c.vz *= .6; c.spin *= .5; }
      c.s = 1 - smooth(clamp((c.t - .9) / .7, 0, 1));
      if (c.t > 1.6) c.on = false;
    } else if (c.mode === 'leave') {
      c.t += dt; c.s = 1 - smooth(clamp(c.t / .5, 0, 1)); c.y = H + c.t * 1.2;
      if (c.t > .5) c.on = false;
    }
  }
  // the plate holds three; the oldest makes room
  if (plate.length > 3 && plate[3].x > SLOT(2) - 1.2) { const c = plate.shift(); c.mode = 'leave'; c.t = 0; }

  trainPulse = damp(trainPulse, training, 8, dt);
  kick = Math.max(0, kick - dt * 3.2);
  drumSpin += dt * (.35 + inDrum * 1.1);
  gaugeVel += ((acc - gaugeV) * 60 - gaugeVel * 7) * dt;
  gaugeV += gaugeVel * dt;
  for (const r of rings) {
    r.goal += dt * r.drift;
    r.vel += ((r.goal - r.a) * 22 - r.vel * 6.5) * dt;
    r.a += r.vel * dt;
  }
}
function pose() {
  m4.rotX(m4.translate(m4.identity(drum.M), XD, H, 0), drumSpin);
  m4.translate(m4.identity(kicker.M), XK, H, -.78 + Math.sin(kick * PI) * .42);
  m4.rotZ(m4.translate(m4.identity(needle.M), ...GAUGE), (225 - 270 * clamp(gaugeV, 0, 1)) / 180 * PI);
  for (const r of rings) m4.rotX(m4.translate(m4.identity(r.M), r.x, H, 0), r.a);
  restring();
}

/* ============================================================
   camera — orthographic, fitted to the space the text leaves
   ============================================================ */
let vw = 1, vh = 1, dpr = 1;
const safe = { l: 24, r: 24, t: 90, b: 60 };
const cam = {
  az: 0, el: 0, azHome: .62, elHome: .56, k: .05, t: [0, 0, 0], ready: false, zoom: 1, zoomG: 1,
  r: [1, 0, 0], u: [0, 1, 0], f: [0, 0, -1], eye: null, kk: .05,
  view: m4.create(), proj: m4.create(), vp: m4.create(),
};
const ptrs = new Map();
let azUser = 0, azVel = 0, elUser = 0, azOff = -.5, elOff = .1;

function frame(b) {
  let a0 = 1e9, a1 = -1e9, b0 = 1e9, b1 = -1e9;
  for (let i = 0; i < 8; i++) {
    const c = [i & 1 ? b.max[0] : b.min[0], i & 2 ? b.max[1] : b.min[1], i & 4 ? b.max[2] : b.min[2]];
    const a = dot(c, cam.r), v = dot(c, cam.u);
    a0 = Math.min(a0, a); a1 = Math.max(a1, a); b0 = Math.min(b0, v); b1 = Math.max(b1, v);
  }
  const sw = Math.max(80, vw - safe.l - safe.r), sh = Math.max(80, vh - safe.t - safe.b);
  const mid = [0, 1, 2].map(i => (b.min[i] + b.max[i]) / 2);
  return { k: Math.max((a1 - a0) / sw, (b1 - b0) / sh), a: (a0 + a1) / 2, v: (b0 + b1) / 2, d: dot(mid, cam.f) };
}
function updateCamera(dt, T) {
  azOff = damp(azOff, 0, 1.3, dt); elOff = damp(elOff, 0, 1.3, dt);
  if (!ptrs.size) { azUser += azVel * dt; azVel = damp(azVel, 0, 2.6, dt); }
  const sway = REDUCED ? 0 : Math.sin(T * .16) * .17;
  cam.az = cam.azHome + azUser + azOff + sway;
  cam.el = clamp(cam.elHome + elUser + elOff, .2, 1.2);
  cam.zoom = damp(cam.zoom, cam.zoomG, 6, dt);
  const ca = Math.cos(cam.az), sa = Math.sin(cam.az), ce = Math.cos(cam.el), se = Math.sin(cam.el);
  cam.r = [ca, 0, -sa]; cam.u = [-sa * se, ce, -ca * se]; cam.f = [-sa * ce, -se, -ca * ce];

  const g = frame(BOUNDS);
  const cx = safe.l + (vw - safe.l - safe.r) / 2 - vw / 2, cy = safe.t + (vh - safe.t - safe.b) / 2 - vh / 2;
  const ta = g.a - cx * g.k, tv = g.v + cy * g.k;
  const goal = [0, 1, 2].map(i => cam.r[i] * ta + cam.u[i] * tv + cam.f[i] * g.d);
  if (!cam.ready) { cam.k = g.k; cam.t = goal; cam.ready = true; }
  const l = 1 - Math.exp(-5 * dt);
  cam.k = lerp(cam.k, g.k, l);
  for (let i = 0; i < 3; i++) cam.t[i] = lerp(cam.t[i], goal[i], l);

  const k = cam.k * cam.zoom, R = 90;
  cam.eye = [0, 1, 2].map(i => cam.t[i] - cam.f[i] * R);
  m4.lookAt(cam.view, cam.eye, cam.t, [0, 1, 0]);
  m4.ortho(cam.proj, -vw * k / 2, vw * k / 2, -vh * k / 2, vh * k / 2, 1, 200);
  m4.mul(cam.vp, cam.proj, cam.view);
  cam.kk = k;
}
function project(p) {
  const m = cam.vp;
  return [
    ((m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12]) * .5 + .5) * vw,
    (1 - ((m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13]) * .5 + .5)) * vh,
  ];
}
function pick(px, py) {
  if (!cam.eye) return -1;
  const a = (px - vw / 2) * cam.kk, v = -(py - vh / 2) * cam.kk;
  const o = [0, 1, 2].map(i => cam.eye[i] + cam.r[i] * a + cam.u[i] * v), d = cam.f;
  let best = -1, bt = 1e9;
  GROUPS.forEach((g, s) => {
    const mn = [g.box[0], .3, -1.6], mx = [g.box[1], g.box[2], 1.6];
    let t0 = -1e9, t1 = 1e9;
    for (let i = 0; i < 3; i++) {
      if (Math.abs(d[i]) < 1e-6) { if (o[i] < mn[i] || o[i] > mx[i]) { t0 = 1; t1 = 0; break; } continue; }
      let n = (mn[i] - o[i]) / d[i], f = (mx[i] - o[i]) / d[i];
      if (n > f) [n, f] = [f, n];
      t0 = Math.max(t0, n); t1 = Math.min(t1, f);
    }
    if (t0 <= t1 && t0 < bt) { bt = t0; best = s; }
  });
  return best;
}

function resize() {
  vw = innerWidth; vh = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(2, Math.round(vw * dpr));
  canvas.height = Math.max(2, Math.round(vh * dpr));
  const top = $('.top').getBoundingClientRect(), foot = $('.foot').getBoundingClientRect();
  // leave air around the figure: it should sit in the sheet, not fill it
  const air = vw < 640 ? 0 : Math.min(vw, vh) * .06;
  safe.l = (vw < 640 ? 22 : 40) + air;
  safe.r = safe.l + (vw < 640 ? 36 : 50);              // the last callout hangs out to the right
  safe.t = top.bottom + 14 + air * .5;
  safe.b = vh - foot.top + 14 + air * .5;
  const tall = clamp((1.5 - (vw - safe.l - safe.r) / Math.max(80, vh - safe.t - safe.b)) / .7, 0, 1);
  cam.azHome = lerp(.6, 1.0, tall); cam.elHome = lerp(.5, .64, tall);
  cam.ready = false;
}
addEventListener('resize', resize);

/* ============================================================
   interaction — drag turns it, a tap feeds it
   ============================================================ */
const labelsEl = $('#labels'), labels = [];
GROUPS.forEach((g, i) => {
  const el = document.createElement('span');
  el.className = 'lab';
  el.innerHTML = `<b>0${i + 1}</b>${g.name}`;
  el.style.transitionDelay = (.12 * i) + 's,0s';
  labelsEl.appendChild(el); labels.push(el);
});

let moved = 0, pinch = 0, hovered = -1, lastMove = 0;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { moved = 0; azVel = 0; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); moved = 99; }
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId);
  if (p && e.pointerType === 'mouse' && !e.buttons) { release(e); return; }   // the button came up somewhere we couldn't see
  if (!p) { if (e.pointerType === 'mouse') hovered = pick(e.clientX, e.clientY); return; }
  const dx = e.clientX - p[0], dy = e.clientY - p[1];
  p[0] = e.clientX; p[1] = e.clientY;
  if (ptrs.size === 1) {
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved < 6) return;
    const now = performance.now(), dtm = Math.max(8, now - lastMove); lastMove = now;
    azUser -= dx * .0052;
    azVel = lerp(azVel, -dx * .0052 / (dtm / 1000), .5);
    elUser = clamp(elUser + dy * .0038, -.3, .45);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch > 0) cam.zoomG = clamp(cam.zoomG * pinch / d, .5, 1.2);
    pinch = d;
  }
});
function release(e) {
  if (!ptrs.delete(e.pointerId)) return;
  if (ptrs.size) return;
  canvas.classList.remove('drag');
  // only a deliberate swipe keeps turning; a shaky tap should not
  if (performance.now() - lastMove > 90 || moved < 40) azVel = 0;
  azVel = clamp(azVel, -1.8, 1.8);
  if (e.type === 'pointerup' && moved < 6) feed();
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('lostpointercapture', release);
canvas.addEventListener('pointerleave', () => { hovered = -1; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.zoomG = clamp(cam.zoomG * (1 + Math.sign(e.deltaY) * .07), .5, 1.2);
}, { passive: false });
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ' || e.key === 'f') { if (document.activeElement === document.body) feed(); }
  else if (e.key === 'ArrowLeft') azVel = 1.2;
  else if (e.key === 'ArrowRight') azVel = -1.2;
});

/* ============================================================
   frame
   ============================================================ */
const LIGHT = [0, 1, 0], emph = GROUPS.map(() => 1);
let baseEmph = 1, reveal = -10, T = 0, last = 0, started = false;
const M0 = m4.create();

function sampleMatrix(c) {
  m4.identity(M0); m4.translate(M0, c.x, c.y, c.z);
  if (c.ry) m4.rotY(M0, c.ry); if (c.rx) m4.rotX(M0, c.rx); if (c.rz) m4.rotZ(M0, c.rz);
  const s = CUBE * Math.max(c.s, .001);
  return m4.scale(M0, s, s, s);
}
function render() {
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(BG[0], BG[1], BG[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);

  // bodies first, pushed a hair back so their own edges win
  gl.useProgram(FACE.p);
  gl.uniformMatrix4fv(FACE.u.uVP, false, cam.vp);
  gl.uniform3fv(FACE.u.uBg, BG); gl.uniform3fv(FACE.u.uAccent, ACCENT); gl.uniform3fv(FACE.u.uLight, LIGHT);
  gl.uniform1f(FACE.u.uReveal, reveal);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1, 1);
  const face = (p, M, fill) => {
    gl.uniformMatrix4fv(FACE.u.uModel, false, M); gl.uniform1f(FACE.u.uFill, fill);
    gl.bindVertexArray(p.fv.vao); gl.drawArrays(gl.TRIANGLES, 0, p.fn);
  };
  for (const p of parts) if (p.fn) face(p, p.M, 0);
  for (const c of samples) if (c.on) face(cube, sampleMatrix(c), c.fill);
  gl.disable(gl.POLYGON_OFFSET_FILL);

  // then the ink
  gl.useProgram(EDGE.p);
  gl.uniformMatrix4fv(EDGE.u.uVP, false, cam.vp);
  gl.uniform2f(EDGE.u.uView, canvas.width, canvas.height);
  gl.uniform3fv(EDGE.u.uFwd, cam.f);
  gl.uniform3fv(EDGE.u.uBg, BG); gl.uniform3fv(EDGE.u.uInk, INK); gl.uniform3fv(EDGE.u.uAccent, ACCENT);
  gl.uniform1f(EDGE.u.uPx, dpr); gl.uniform1f(EDGE.u.uReveal, reveal);
  gl.uniform1f(EDGE.u.uBias, 1.6 * cam.kk * .01);
  const dm = dot(cam.t, cam.f);
  gl.uniform2f(EDGE.u.uDepth, dm - 9, dm + 9);
  const edge = (vao, n, M, e, hot) => {
    gl.uniformMatrix4fv(EDGE.u.uModel, false, M);
    gl.uniform1f(EDGE.u.uEmph, e); gl.uniform1f(EDGE.u.uHot, hot);
    gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES, 0, n);
  };
  for (const p of parts) edge(p.ev.vao, p.en, p.M, p.group < 0 ? baseEmph : emph[p.group], 0);
  edge(strings.vao, strings.n, m4.identity(M0), emph[2] * (.72 + trainPulse * .28), trainPulse);
  for (const c of samples) if (c.on) edge(cube.ev.vao, cube.en, sampleMatrix(c), 1, c.fill);
}
function placeLabels() {
  GROUPS.forEach((g, i) => {
    const p = project([g.at[0], LABEL_Y, g.at[2]]);
    labels[i].style.transform = `translate3d(${p[0].toFixed(1)}px,${p[1].toFixed(1)}px,0) translate(7px,-2px)`;
    labels[i].classList.toggle('on', i === hovered);
  });
}

function tick(now) {
  requestAnimationFrame(tick);
  const real = Math.min((now - last) / 1000, .1); last = now;
  const dt = REDUCED ? real * .6 : real;
  T += dt;

  // the figure is drawn from left to right before anything moves
  if (reveal < 12) {
    reveal += real * (REDUCED ? 60 : 9.5);
    if (reveal > 9.5) document.body.classList.add('drawn');
  }
  step(dt);
  pose();

  baseEmph = damp(baseEmph, hovered < 0 ? 1 : .7, 8, real);
  for (let i = 0; i < emph.length; i++) emph[i] = damp(emph[i], hovered < 0 ? 1 : i === hovered ? 1.2 : .62, 8, real);

  updateCamera(real, T);
  // light from the upper left of the view, whichever way the figure is turned
  const l = [-.55 * cam.r[0] - .35 * cam.f[0], 1, -.55 * cam.r[2] - .35 * cam.f[2]], ll = Math.hypot(...l);
  LIGHT[0] = l[0] / ll; LIGHT[1] = l[1] / ll; LIGHT[2] = l[2] / ll;
  render();
  placeLabels();
  if (!started) { started = true; document.body.classList.add('ready'); }
}

buildMachine();
rings.forEach((r, i) => { r.drift = [.07, -.1, .06][i]; r.a = r.goal = [.2, -.3, .5][i]; });
resize();
// the machine has been running for a while before anyone arrives
for (let i = 0; i < 600; i++) step(1 / 30);
requestAnimationFrame((t) => { last = t; tick(t); });
addEventListener('visibilitychange', () => { if (!document.hidden) last = performance.now(); });

})();
</script>
</body>
</html>
